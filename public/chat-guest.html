<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Inference — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Input toolbar row ─────────────────────────────────── */
    .chat-input-toolbar {
      max-width: 760px;
      margin: 0 auto 0.45rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ── Thinking mode trigger ─────────────────────────────── */
    .mode-trigger {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.6rem;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .mode-trigger:hover { border-color: var(--text); color: var(--text); }
    .mode-trigger.active { border-color: var(--text); color: var(--text); background: var(--surface); }
    .mode-trigger .cloud-icon { font-size: 1rem; line-height: 1; }

    /* ── Shared dropdown styles ────────────────────────────── */
    .dropdown-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      min-width: 180px;
      z-index: 200;
      overflow: hidden;
      animation: dropUp 0.15s ease both;
    }
    @keyframes dropUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .dropdown-panel.hidden { display: none; }

    .dropdown-heading {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 0.6rem 0.85rem 0.3rem;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.1s;
      color: var(--text);
    }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.selected { font-weight: 500; background: var(--bg); }
    .dropdown-item .item-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .dropdown-item.selected .item-dot { background: var(--text); }
    .dropdown-divider { height: 1px; background: var(--border); margin: 0.3rem 0; }

    /* ── Mode trigger wrapper ──────────────────────────────── */
    .mode-trigger-wrapper { position: relative; }

    /* ── Textarea with inline model button ─────────────────── */
    .chat-input-box-wrapper {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 0.65rem;
      align-items: flex-end;
    }

    .textarea-with-controls {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-end;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      transition: border-color 0.15s;
      overflow: hidden;
    }
    .textarea-with-controls:focus-within { border-color: var(--text); }

    .textarea-with-controls textarea {
      flex: 1;
      padding: 0.65rem 0.85rem;
      padding-right: 0.5rem;
      border: none;
      border-radius: 0;
      font-family: var(--font-body);
      font-size: 0.925rem;
      resize: none;
      background: transparent;
      color: var(--text);
      outline: none;
      line-height: 1.5;
      max-height: 140px;
    }

    .inline-model-wrapper {
      position: relative;
      align-self: flex-end;
      margin: 0.45rem 0.5rem 0.45rem 0;
    }
    .inline-model-wrapper .dropdown-panel {
      right: 0;
      left: auto;
      min-width: 210px;
    }

    .inline-model-btn {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.28rem 0.55rem;
      border: 1.5px solid var(--border);
      border-radius: calc(var(--radius) - 1px);
      background: var(--surface);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
      white-space: nowrap;
      max-width: 140px;
    }
    .inline-model-btn:hover { border-color: var(--text); }
    .inline-model-btn .model-name-display {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 90px;
    }
    .inline-model-btn .chevron { font-size: 0.55rem; color: var(--muted); }
  </style>
</head>
<body class="chat-body">

  <header class="chat-header">
    <span class="chat-logo">&#x25C6; LLM Interface</span>
    <div style="display:flex; align-items:center; gap:0.75rem;">
      <span class="chat-badge">Guest session</span>
      <a href="login.html" class="btn btn-secondary" style="padding:0.4rem 0.9rem; font-size:0.82rem;">Sign in</a>
    </div>
  </header>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-welcome" id="welcomeMsg">
      <h2>Hello!</h2>
      <p>You're chatting as a guest. Ask me anything.</p>
    </div>
  </div>

  <div class="chat-input-area">

    <!-- Toolbar: thinking mode -->
    <div class="chat-input-toolbar">
      <div class="mode-trigger-wrapper">
        <button class="mode-trigger" id="modeTrigger" title="Select thinking mode">
          <span class="cloud-icon">🌤</span>
          <span class="mode-label-text" id="modeLabelText">General</span>
        </button>

        <div class="dropdown-panel hidden" id="modeDropdown">
          <div class="dropdown-heading">Thinking Modes</div>
          <div class="dropdown-item selected" data-mode="general">
            <span class="item-dot"></span> General
          </div>
          <div class="dropdown-item" data-mode="math">
            <span class="item-dot"></span> Math
          </div>
          <div class="dropdown-item" data-mode="weather">
            <span class="item-dot"></span> Weather
          </div>
        </div>
      </div>
    </div>

    <!-- Textarea + inline model selector -->
    <div class="chat-input-box-wrapper">
      <div class="textarea-with-controls">
        <textarea
          id="chatInput"
          rows="1"
          placeholder="Ask anything…"
        ></textarea>

        <div class="inline-model-wrapper">
          <button class="inline-model-btn" id="modelTrigger" title="Select model">
            <span class="model-name-display" id="modelLabelText">Llama 3 (local)</span>
            <span class="chevron">▼</span>
          </button>

          <div class="dropdown-panel hidden" id="modelDropdown">
            <div class="dropdown-heading">Local Models</div>
            <div id="localModelsList"></div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-heading">Public Models</div>
            <div id="publicModelsList"></div>
          </div>
        </div>
      </div>

      <button class="chat-send-btn" id="sendBtn">Send</button>
    </div>

  </div>

  <script>
    // ── State ────────────────────────────────────────────────
    let selectedMode  = "general";
    let selectedModel = "ollama-llama3";

    // ── Session guard ────────────────────────────────────────
    (async () => {
      try {
        const res  = await fetch("/api/auth/me");
        const data = await res.json();
        if (!data.guest && !data.user && !data.casUser) {
          window.location.href = "index.html";
        }
      } catch { window.location.href = "index.html"; }
    })();

    // ── Load models ──────────────────────────────────────────
    (async () => {
      try {
        const res    = await fetch("/api/llm/models");
        const data   = await res.json();
        const models = data.models || [];

        const localList  = document.getElementById("localModelsList");
        const publicList = document.getElementById("publicModelsList");

        models.forEach((m, i) => {
          const item = document.createElement("div");
          item.className   = "dropdown-item" + (i === 0 ? " selected" : "");
          item.dataset.modelId = m.id;
          item.innerHTML   = `<span class="item-dot"></span> ${m.label}`;
          item.addEventListener("click", () => selectModel(m.id, m.label));
          if (m.type === "local") localList.appendChild(item);
          else                    publicList.appendChild(item);
        });

        if (models.length > 0) {
          selectedModel = models[0].id;
          document.getElementById("modelLabelText").textContent = models[0].label;
        }
      } catch (err) {
        console.warn("Could not load models:", err);
      }
    })();

    // ── Auto-resize textarea ─────────────────────────────────
    const chatInput = document.getElementById("chatInput");
    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = chatInput.scrollHeight + "px";
    });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById("sendBtn").addEventListener("click", sendMessage);

    // ── Thinking mode dropdown ───────────────────────────────
    const modeTrigger  = document.getElementById("modeTrigger");
    const modeDropdown = document.getElementById("modeDropdown");

    modeTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      modeDropdown.classList.toggle("hidden");
      modelDropdown.classList.add("hidden");
      modeTrigger.classList.toggle("active", !modeDropdown.classList.contains("hidden"));
    });

    document.querySelectorAll("#modeDropdown .dropdown-item").forEach(item => {
      item.addEventListener("click", () => {
        selectedMode = item.dataset.mode;
        document.getElementById("modeLabelText").textContent = item.textContent.trim();
        document.querySelectorAll("#modeDropdown .dropdown-item")
          .forEach(el => el.classList.remove("selected"));
        item.classList.add("selected");
        modeDropdown.classList.add("hidden");
        modeTrigger.classList.remove("active");
      });
    });

    // ── Model dropdown ───────────────────────────────────────
    const modelTrigger  = document.getElementById("modelTrigger");
    const modelDropdown = document.getElementById("modelDropdown");

    modelTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      modelDropdown.classList.toggle("hidden");
      modeDropdown.classList.add("hidden");
      modeTrigger.classList.remove("active");
    });

    function selectModel(id, label) {
      selectedModel = id;
      document.getElementById("modelLabelText").textContent = label;
      document.querySelectorAll("#modelDropdown .dropdown-item")
        .forEach(el => el.classList.remove("selected"));
      const active = document.querySelector(`[data-model-id="${id}"]`);
      if (active) active.classList.add("selected");
      modelDropdown.classList.add("hidden");
    }

    document.addEventListener("click", () => {
      modeDropdown.classList.add("hidden");
      modelDropdown.classList.add("hidden");
      modeTrigger.classList.remove("active");
    });

    // ── Message rendering ────────────────────────────────────
    function appendMessage(role, text) {
      const welcome = document.getElementById("welcomeMsg");
      if (welcome) welcome.remove();

      const container    = document.getElementById("chatMessages");
      const msg          = document.createElement("div");
      msg.className      = `message ${role}`;
      const bubble       = document.createElement("div");
      bubble.className   = "message-bubble";
      bubble.textContent = text;
      msg.appendChild(bubble);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    // ── Send message ─────────────────────────────────────────
    async function sendMessage() {
      const text    = chatInput.value.trim();
      const sendBtn = document.getElementById("sendBtn");
      if (!text) return;

      appendMessage("user", text);
      chatInput.value        = "";
      chatInput.style.height = "auto";
      sendBtn.disabled       = true;

      try {
        const llmRes = await fetch("/api/llm/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt:  text,
            modelId: selectedModel,
            mode:    selectedMode,
            history: []
          })
        });

        const llmData = await llmRes.json();
        appendMessage("assistant", llmData.response || "No response from model.");
      } catch (err) {
        console.error(err);
        appendMessage("assistant", "Error sending message.");
      }

      sendBtn.disabled = false;
    }
  </script>

</body>
</html>
