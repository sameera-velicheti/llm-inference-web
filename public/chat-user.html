<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Inference — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── New Chat Button ───────────────────────────────────── */
    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      background: var(--surface);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .new-chat-btn:hover {
      border-color: var(--text);
      background: var(--bg);
    }
    .new-chat-btn .plus-icon {
      font-size: 1rem;
      line-height: 1;
      color: var(--accent);
      font-weight: 400;
    }

    /* ── Input toolbar row ─────────────────────────────────── */
    .chat-input-toolbar {
      max-width: 760px;
      margin: 0 auto 0.45rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* ── Thinking mode trigger (cloud icon) ────────────────── */
    .mode-trigger {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.3rem 0.6rem;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      position: relative;
      white-space: nowrap;
    }
    .mode-trigger:hover {
      border-color: var(--text);
      color: var(--text);
    }
    .mode-trigger.active {
      border-color: var(--text);
      color: var(--text);
      background: var(--surface);
    }
    .mode-trigger .cloud-icon {
      font-size: 1rem;
      line-height: 1;
    }
    .mode-label-text {
      font-size: 0.78rem;
    }

    /* ── Dropdown shared styles ────────────────────────────── */
    .dropdown-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      min-width: 180px;
      z-index: 200;
      overflow: hidden;
      animation: dropUp 0.15s ease both;
    }
    @keyframes dropUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .dropdown-panel.hidden { display: none; }

    .dropdown-heading {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--muted);
      padding: 0.6rem 0.85rem 0.3rem;
    }
    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.85rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.1s;
      border-radius: 0;
      color: var(--text);
    }
    .dropdown-item:hover { background: var(--bg); }
    .dropdown-item.selected {
      font-weight: 500;
      background: var(--bg);
    }
    .dropdown-item .item-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .dropdown-item.selected .item-dot { background: var(--text); }
    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 0.3rem 0;
    }

    /* ── Mode trigger wrapper (for positioning dropdown) ───── */
    .mode-trigger-wrapper {
      position: relative;
    }

    /* ── Model selector (inside the textarea row) ──────────── */
    .model-selector-wrapper {
      position: relative;
      margin-left: auto;
    }
    .model-selector-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.55rem 0.3rem 0.7rem;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
      white-space: nowrap;
      max-width: 160px;
    }
    .model-selector-btn:hover { border-color: var(--text); }
    .model-selector-btn .model-name-display {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 110px;
    }
    .model-selector-btn .chevron {
      font-size: 0.6rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* Model dropdown opens upward, aligned to right */
    .model-dropdown-panel {
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      left: auto;
      min-width: 210px;
    }

    /* ── Inline model selector inside textarea box ─────────── */
    .chat-input-box-wrapper {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      gap: 0.65rem;
      align-items: flex-end;
    }

    .textarea-with-controls {
      flex: 1;
      position: relative;
      display: flex;
      align-items: flex-end;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      transition: border-color 0.15s;
      overflow: hidden; /* keep children clipped */
    }
    .textarea-with-controls:focus-within { border-color: var(--text); }

    .textarea-with-controls textarea {
      flex: 1;
      padding: 0.65rem 0.85rem;
      /* leave right space for the inline model btn */
      padding-right: 0.5rem;
      border: none;
      border-radius: 0;
      font-family: var(--font-body);
      font-size: 0.925rem;
      resize: none;
      background: transparent;
      color: var(--text);
      outline: none;
      line-height: 1.5;
      max-height: 140px;
    }

    /* inline model button sits inside the textarea box on the right */
    .inline-model-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin: 0.45rem 0.5rem 0.45rem 0;
      padding: 0.28rem 0.55rem;
      border: 1.5px solid var(--border);
      border-radius: calc(var(--radius) - 1px);
      background: var(--surface);
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s;
      white-space: nowrap;
      max-width: 140px;
      align-self: flex-end;
    }
    .inline-model-btn:hover { border-color: var(--text); }
    .inline-model-btn .model-name-display {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 90px;
    }
    .inline-model-btn .chevron { font-size: 0.55rem; color: var(--muted); }

    /* model dropdown anchored to inline btn */
    .inline-model-wrapper {
      position: relative;
      align-self: flex-end;
      margin: 0.45rem 0.5rem 0.45rem 0;
    }
    .inline-model-wrapper .dropdown-panel {
      right: 0;
      left: auto;
      min-width: 210px;
    }
  </style>
</head>
<body class="chat-body">
  <div class="chat-layout">

  <!-- Sidebar -->
  <aside class="chat-sidebar">
    <input
      type="text"
      id="chatSearch"
      class="chat-search"
      placeholder="Search chats..."
    />

    <!-- + New Chat button -->
    <button class="new-chat-btn" id="newChatBtn">
      <span class="plus-icon">+</span> New Chat
    </button>

    <h3 class="sidebar-title">Previous Chats</h3>
    <div id="chatList"></div>
  </aside>

  <!-- Main Chat Area -->
  <div class="chat-main">

    <header class="chat-header">
      <span class="chat-logo">&#x25C6; LLM Interface</span>
      <div style="display:flex; align-items:center; gap:0.75rem;">
        <span class="chat-badge" id="userBadge">Signed in</span>
        <button class="btn btn-secondary" id="logoutBtn" style="padding:0.4rem 0.9rem; font-size:0.82rem;">Log out</button>
      </div>
    </header>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-welcome" id="welcomeMsg">
        <h2>Hello!</h2>
        <p id="welcomeSub">Ask me anything.</p>
      </div>
    </div>

    <div class="chat-input-area">

      <!-- Toolbar row: thinking mode pill -->
      <div class="chat-input-toolbar">
        <div class="mode-trigger-wrapper">
          <button class="mode-trigger" id="modeTrigger" title="Select thinking mode">
            <span class="cloud-icon">🌤</span>
            <span class="mode-label-text" id="modeLabelText">General</span>
          </button>

          <!-- Thinking Modes dropdown -->
          <div class="dropdown-panel hidden" id="modeDropdown">
            <div class="dropdown-heading">Thinking Modes</div>
            <div class="dropdown-item selected" data-mode="general">
              <span class="item-dot"></span> General
            </div>
            <div class="dropdown-item" data-mode="math">
              <span class="item-dot"></span> Math
            </div>
            <div class="dropdown-item" data-mode="weather">
              <span class="item-dot"></span> Weather
            </div>
          </div>
        </div>
      </div>

      <!-- Textarea row with inline model selector -->
      <div class="chat-input-box-wrapper">
        <div class="textarea-with-controls">
          <textarea
            id="chatInput"
            rows="1"
            placeholder="Ask anything…"
          ></textarea>

          <!-- Inline model button inside the textarea box -->
          <div class="inline-model-wrapper">
            <button class="inline-model-btn" id="modelTrigger" title="Select model">
              <span class="model-name-display" id="modelLabelText">Llama 3 (local)</span>
              <span class="chevron">▼</span>
            </button>

            <!-- Model dropdown -->
            <div class="dropdown-panel hidden" id="modelDropdown">
              <div class="dropdown-heading">Local Models</div>
              <!-- populated by JS from /api/llm/models -->
              <div id="localModelsList"></div>
              <div class="dropdown-divider"></div>
              <div class="dropdown-heading">Public Models</div>
              <div id="publicModelsList"></div>
            </div>
          </div>
        </div>

        <button class="chat-send-btn" id="sendBtn">Send</button>
      </div>

    </div><!-- /chat-input-area -->

  </div><!-- /chat-main -->
  </div><!-- /chat-layout -->

  <script>
    // ── State ────────────────────────────────────────────────
    let currentChatId  = null;
    let selectedMode   = "general";
    let selectedModel  = "ollama-llama3";

    // ── Session guard ────────────────────────────────────────
    (async () => {
      try {
        const res  = await fetch("/api/auth/me");
        const data = await res.json();
        if (data.user) {
          document.getElementById("userBadge").textContent = data.user.email;
          document.getElementById("welcomeSub").textContent =
            `Signed in as ${data.user.username}. Ask me anything.`;
        } else {
          window.location.href = "login.html";
        }
      } catch {
        window.location.href = "login.html";
      }
    })();

    // ── Load model list from backend ─────────────────────────
    (async () => {
      try {
        const res    = await fetch("/api/llm/models");
        const data   = await res.json();
        const models = data.models || [];

        const localList  = document.getElementById("localModelsList");
        const publicList = document.getElementById("publicModelsList");

        models.forEach((m, i) => {
          const item = document.createElement("div");
          item.className = "dropdown-item" + (i === 0 ? " selected" : "");
          item.dataset.modelId = m.id;
          item.innerHTML = `<span class="item-dot"></span> ${m.label}`;
          item.addEventListener("click", () => selectModel(m.id, m.label));

          if (m.type === "local")  localList.appendChild(item);
          else                     publicList.appendChild(item);
        });

        // Default to first model
        if (models.length > 0) {
          selectedModel = models[0].id;
          document.getElementById("modelLabelText").textContent = models[0].label;
        }
      } catch (err) {
        console.warn("Could not load models from /api/llm/models:", err);
      }
    })();

    // ── Logout ───────────────────────────────────────────────
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try { await fetch("/api/auth/logout", { method: "POST" }); } finally {
        window.location.href = "index.html";
      }
    });

    // ── New Chat ─────────────────────────────────────────────
    document.getElementById("newChatBtn").addEventListener("click", () => {
      currentChatId = null;
      const container = document.getElementById("chatMessages");
      container.innerHTML = `
        <div class="chat-welcome" id="welcomeMsg">
          <h2>Hello!</h2>
          <p id="welcomeSub">Ask me anything.</p>
        </div>`;
      document.getElementById("chatInput").value = "";
      document.getElementById("chatInput").style.height = "auto";
    });

    // ── Auto-resize textarea ─────────────────────────────────
    const chatInput = document.getElementById("chatInput");
    chatInput.addEventListener("input", () => {
      chatInput.style.height = "auto";
      chatInput.style.height = chatInput.scrollHeight + "px";
    });

    // ── Send on Enter ────────────────────────────────────────
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById("sendBtn").addEventListener("click", sendMessage);

    // ── Thinking Mode dropdown ───────────────────────────────
    const modeTrigger  = document.getElementById("modeTrigger");
    const modeDropdown = document.getElementById("modeDropdown");

    modeTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      modeDropdown.classList.toggle("hidden");
      modelDropdown.classList.add("hidden");
      modeTrigger.classList.toggle("active", !modeDropdown.classList.contains("hidden"));
    });

    document.querySelectorAll("#modeDropdown .dropdown-item").forEach(item => {
      item.addEventListener("click", () => {
        selectedMode = item.dataset.mode;
        document.getElementById("modeLabelText").textContent =
          item.textContent.trim();
        document.querySelectorAll("#modeDropdown .dropdown-item")
          .forEach(el => el.classList.remove("selected"));
        item.classList.add("selected");
        modeDropdown.classList.add("hidden");
        modeTrigger.classList.remove("active");
      });
    });

    // ── Model dropdown ───────────────────────────────────────
    const modelTrigger  = document.getElementById("modelTrigger");
    const modelDropdown = document.getElementById("modelDropdown");

    modelTrigger.addEventListener("click", (e) => {
      e.stopPropagation();
      modelDropdown.classList.toggle("hidden");
      modeDropdown.classList.add("hidden");
      modeTrigger.classList.remove("active");
    });

    function selectModel(id, label) {
      selectedModel = id;
      document.getElementById("modelLabelText").textContent = label;
      document.querySelectorAll("#modelDropdown .dropdown-item")
        .forEach(el => el.classList.remove("selected"));
      const active = document.querySelector(`[data-model-id="${id}"]`);
      if (active) active.classList.add("selected");
      modelDropdown.classList.add("hidden");
    }

    // ── Close dropdowns on outside click ────────────────────
    document.addEventListener("click", () => {
      modeDropdown.classList.add("hidden");
      modelDropdown.classList.add("hidden");
      modeTrigger.classList.remove("active");
    });

    // ── Message rendering ────────────────────────────────────
    function appendMessage(role, text) {
      const welcome = document.getElementById("welcomeMsg");
      if (welcome) welcome.remove();

      const container = document.getElementById("chatMessages");
      const msg       = document.createElement("div");
      msg.className   = `message ${role}`;

      const bubble       = document.createElement("div");
      bubble.className   = "message-bubble";
      bubble.textContent = text;

      msg.appendChild(bubble);
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;
    }

    // ── Send message ─────────────────────────────────────────
    async function sendMessage() {
      const text    = chatInput.value.trim();
      const sendBtn = document.getElementById("sendBtn");
      if (!text) return;

      appendMessage("user", text);
      chatInput.value        = "";
      chatInput.style.height = "auto";
      sendBtn.disabled       = true;

      try {
        // Create chat thread if first message
        if (!currentChatId) {
          const res  = await fetch("/api/chats", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ title: text.substring(0, 25) })
          });
          const data = await res.json();
          currentChatId = data.chatId;
          loadChats();
        }

        // Save user message to DB
        await fetch(`/api/chats/${currentChatId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: "user", message: text })
        });

        // Fetch history for context
        let history = [];
        try {
          const histRes = await fetch(`/api/chats/${currentChatId}/messages`);
          history = await histRes.json();
        } catch (_) {}

        // Call LLM
        const llmRes = await fetch("/api/llm/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt:  text,
            modelId: selectedModel,
            mode:    selectedMode,
            history
          })
        });

        const llmData = await llmRes.json();
        const reply   = llmData.response || "No response from model.";

        appendMessage("assistant", reply);

        // Save assistant message to DB
        await fetch(`/api/chats/${currentChatId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ role: "assistant", message: reply })
        });

      } catch (err) {
        console.error(err);
        appendMessage("assistant", "Error sending message.");
      }

      sendBtn.disabled = false;
    }

    // ── Chat history ─────────────────────────────────────────
    async function loadChats() {
      try {
        const res   = await fetch("/api/chats");
        const chats = await res.json();
        const chatList = document.getElementById("chatList");
        chatList.innerHTML = "";
        chats.forEach(chat => {
          const item = document.createElement("div");
          item.className   = "chat-item";
          item.textContent = chat.title || "New Chat";
          item.onclick     = () => loadMessages(chat.id);
          chatList.appendChild(item);
        });
      } catch (err) { console.error("Failed to load chats"); }
    }

    async function loadMessages(chatId) {
      currentChatId = chatId;
      const res      = await fetch(`/api/chats/${chatId}/messages`);
      const messages = await res.json();
      const container = document.getElementById("chatMessages");
      container.innerHTML = "";
      messages.forEach(m => appendMessage(m.role, m.message));
    }

    // ── Search chats ─────────────────────────────────────────
    document.getElementById("chatSearch").addEventListener("input", async function() {
      const query = this.value.trim();
      if (!query) { loadChats(); return; }
      const res   = await fetch(`/api/chats/search?q=${encodeURIComponent(query)}`);
      const chats = await res.json();
      const chatList = document.getElementById("chatList");
      chatList.innerHTML = "";
      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className   = "chat-item";
        item.textContent = chat.title || "New Chat";
        item.onclick     = () => loadMessages(chat.id);
        chatList.appendChild(item);
      });
    });

    loadChats();
  </script>
</body>
</html>
