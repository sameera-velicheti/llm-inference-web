<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Interface</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="chat-body">
<div class="chat-layout">

<!-- Sidebar -->
<aside class="chat-sidebar">
  <input id="chatSearch" class="chat-search" placeholder="Search chats..." />
  <h3>Previous Chats</h3>
  <div id="chatList"></div>
</aside>

<!-- Main -->
<div class="chat-main">

<header>
  <span>LLM Interface</span>
  <button id="logoutBtn">Log out</button>
</header>

<div id="chatMessages">
  <div id="welcomeMsg">
    <h2>Hello!</h2>
    <p>Ask me anything.</p>
  </div>
</div>

<!-- MULTI LLM -->
<div id="multiLLMResponses"></div>

<div class="chat-input-area">
  <textarea id="chatInput" placeholder="Ask anything..."></textarea>
  <button id="sendBtn">Send</button>
</div>

<script>
let currentChatId = null;
let lastPrompt = "";
let activeModel = null;

/* MODELS */
const models = [
  { id: "chatgpt", name: "ChatGPT" },
  { id: "claude", name: "Claude" },
  { id: "gemini", name: "Gemini" }
];

/* SEND */
document.getElementById("sendBtn").onclick = sendMessage;

/* ENTER SEND */
document.getElementById("chatInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

/* MESSAGE UI */
function appendMessage(role, text) {
  document.getElementById("welcomeMsg")?.remove();

  const msg = document.createElement("div");
  msg.className = role;
  msg.textContent = text;

  document.getElementById("chatMessages").appendChild(msg);
}

/* MOCK RESPONSES */
function mockLLMResponse(model, prompt) {
  if (model === "ChatGPT") return `ChatGPT: structured answer for "${prompt}"`;
  if (model === "Claude") return `Claude: thoughtful answer for "${prompt}"`;
  return `Gemini: quick answer for "${prompt}"`;
}

/* RENDER CARDS */
function renderMultiLLM(prompt) {
  const container = document.getElementById("multiLLMResponses");
  container.innerHTML = "";

  models.forEach(m => {
    const card = document.createElement("div");
    card.className = "llm-card";
    card.id = m.id + "-card";

    card.innerHTML = `
      <h3>${m.name}</h3>
      <p id="${m.id}-response">${mockLLMResponse(m.name, prompt)}</p>

      <p><strong>Do you prefer this response?</strong></p>

      <button onclick="regenerate('${m.id}','${m.name}')">Regenerate</button>
      <button onclick="continueLLM('${m.id}','${m.name}')">Continue with ${m.name}</button>
    `;

    container.appendChild(card);
  });
}

/* REGENERATE */
function regenerate(id, name) {
  document.getElementById(id + "-response").textContent =
    `${name} regenerated response for "${lastPrompt}"`;
}

/* CONTINUE */
function continueLLM(id, name) {
  activeModel = name;

  document.querySelectorAll(".llm-card").forEach(c => c.classList.remove("active"));
  document.getElementById(id + "-card").classList.add("active");

  appendMessage("assistant", `Continuing with ${name}`);
}

/* SEND MESSAGE */
async function sendMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();

  if (!text) return;

  lastPrompt = text;

  appendMessage("user", text);
  input.value = "";

  /* CREATE CHAT */
  if (!currentChatId) {
    const res = await fetch("/api/chats", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ title: text })
    });

    const data = await res.json();
    currentChatId = data.chatId;
  }

  /* SAVE USER MESSAGE */
  await fetch(`/api/chats/${currentChatId}/messages`, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ role:"user", message:text })
  });

  /* MULTI OR SINGLE */
  if (!activeModel) {
    renderMultiLLM(text);
    appendMessage("assistant", "3 responses generated.");
  } else {
    const reply = mockLLMResponse(activeModel, text);
    appendMessage("assistant", reply);
  }
}

/* LOAD CHATS */
async function loadChats() {
  const res = await fetch("/api/chats");
  const chats = await res.json();

  const chatListDiv = document.getElementById("chatList");
  chatListDiv.innerHTML = "";

  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item";
    item.textContent = c.title || "New Chat";
    item.onclick = () => loadMessages(c.id);
    chatListDiv.appendChild(item);
  });
}

/* LOAD MESSAGES */
async function loadMessages(id) {
  currentChatId = id;

  const res = await fetch(`/api/chats/${id}/messages`);
  const msgs = await res.json();

  const container = document.getElementById("chatMessages");
  container.innerHTML = "";

  document.getElementById("multiLLMResponses").innerHTML = "";

  msgs.forEach(m => appendMessage(m.role, m.message));
}

/* SEARCH */
const searchInput = document.getElementById("chatSearch");

searchInput.oninput = async () => {
  const q = searchInput.value.trim();

  if (!q) return loadChats();

  const res = await fetch(`/api/chats/search?q=${encodeURIComponent(q)}`);
  const chats = await res.json();

  const chatListDiv = document.getElementById("chatList");
  chatListDiv.innerHTML = "";

  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item";
    item.textContent = c.title || "New Chat";
    item.onclick = () => loadMessages(c.id);
    chatListDiv.appendChild(item);
  });
};

loadChats();
</script>

</div>
</div>
</body>
</html>
