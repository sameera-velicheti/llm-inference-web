<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Inference — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="chat-body">
  <div class="chat-layout">

    <!-- Sidebar -->
    <aside class="chat-sidebar">
      <input
        type="text"
        id="chatSearch"
        class="chat-search"
        placeholder="Search chats..."
      />

      <h3 class="sidebar-title">Previous Chats</h3>
      <div id="chatList"></div>
    </aside>

    <!-- Main Chat Area -->
    <div class="chat-main">

      <header class="chat-header">
        <span class="chat-logo">&#x25C6; LLM Interface</span>
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <span class="chat-badge" id="userBadge">Signed in</span>
          <button class="btn btn-secondary" id="logoutBtn" style="padding:0.4rem 0.9rem; font-size:0.82rem;">
            Log out
          </button>
        </div>
      </header>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome" id="welcomeMsg">
          <h2>Hello!</h2>
          <p id="welcomeSub">Ask me anything.</p>
        </div>
      </div>

      <!-- Multi-LLM response cards -->
      <div id="multiLLMResponses" class="multi-llm-responses"></div>

      <div class="chat-input-area">
        <div class="chat-input-inner">
          <textarea
            id="chatInput"
            rows="1"
            placeholder="Ask anything…"
          ></textarea>
          <button class="chat-send-btn" id="sendBtn">Send</button>
        </div>
      </div>

      <script>
        let currentChatId = null;
        let lastPrompt = "";
        let activeModel = null;

        // ── Session guard ────────────────────────────────────────
        (async () => {
          try {
            const res = await fetch("/api/auth/me");
            const data = await res.json();

            if (data.user) {
              document.getElementById("userBadge").textContent = data.user.email;
              document.getElementById("welcomeSub").textContent =
                `Signed in as ${data.user.username}. Ask me anything.`;
            } else {
              window.location.href = "login.html";
            }
          } catch {
            window.location.href = "login.html";
          }
        })();

        // ── Logout ───────────────────────────────────────────────
        document.getElementById("logoutBtn").addEventListener("click", async () => {
          try {
            await fetch("/api/auth/logout", { method: "POST" });
          } finally {
            window.location.href = "index.html";
          }
        });

        // ── Auto-resize textarea ─────────────────────────────────
        const chatInput = document.getElementById("chatInput");

        chatInput.addEventListener("input", () => {
          chatInput.style.height = "auto";
          chatInput.style.height = chatInput.scrollHeight + "px";
        });

        // ── Send on Enter ────────────────────────────────────────
        chatInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        document.getElementById("sendBtn").addEventListener("click", sendMessage);

        // ── Message rendering ────────────────────────────────────
        function appendMessage(role, text) {
          const welcome = document.getElementById("welcomeMsg");
          if (welcome) welcome.remove();

          const container = document.getElementById("chatMessages");
          const msg = document.createElement("div");
          msg.className = `message ${role}`;

          const bubble = document.createElement("div");
          bubble.className = "message-bubble";
          bubble.textContent = text;

          msg.appendChild(bubble);
          container.appendChild(msg);
          container.scrollTop = container.scrollHeight;
        }

        // ── Mock LLM Responses ───────────────────────────────────
        function mockLLMResponse(model, prompt) {
          if (model === "ChatGPT") {
            return `ChatGPT response: Here is a clear and organized answer to "${prompt}".`;
          }

          if (model === "Claude") {
            return `Claude response: Here is a thoughtful and detailed answer to "${prompt}".`;
          }

          return `Gemini response: Here is a quick and practical answer to "${prompt}".`;
        }

        function renderMultiLLMResponses(prompt) {
          const container = document.getElementById("multiLLMResponses");
          container.innerHTML = "";

          const models = ["ChatGPT", "Claude", "Gemini"];

          models.forEach(model => {
            const response = mockLLMResponse(model, prompt);

            const card = document.createElement("div");
            card.className = "llm-card";
            card.id = `${model}-card`;

            card.innerHTML = `
              <h3>${model}</h3>
              <p id="${model}-response">${response}</p>

              <p><strong>Do you prefer this response?</strong></p>

              <button onclick="regenerateResponse('${model}')">
                Regenerate
              </button>

              <button onclick="continueWithLLM('${model}')">
                Continue with ${model}
              </button>
            `;

            container.appendChild(card);
          });
        }

        function regenerateResponse(model) {
          const responseBox = document.getElementById(`${model}-response`);

          responseBox.textContent =
            `${model} regenerated response: Here is another version of the answer to "${lastPrompt}".`;
        }

        function continueWithLLM(model) {
          activeModel = model;

          document.querySelectorAll(".llm-card").forEach(card => {
            card.classList.remove("active");
          });

          const selectedCard = document.getElementById(`${model}-card`);
          if (selectedCard) {
            selectedCard.classList.add("active");
          }

          appendMessage("assistant", `You chose to continue with ${model}. Future responses will use this LLM.`);
        }

        // ── Send message ─────────────────────────────────────────
        async function sendMessage() {
          const text = chatInput.value.trim();
          const sendBtn = document.getElementById("sendBtn");

          if (!text) return;

          lastPrompt = text;

          appendMessage("user", text);

          chatInput.value = "";
          chatInput.style.height = "auto";
          sendBtn.disabled = true;

          try {
            // Create chat if it does not exist yet
            if (!currentChatId) {
              const res = await fetch("/api/chats", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  title: text.substring(0, 25)
                })
              });

              const data = await res.json();
              currentChatId = data.chatId;

              loadChats();
            }

            // Save user message
            await fetch(`/api/chats/${currentChatId}/messages`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                role: "user",
                message: text
              })
            });

            let reply;

            if (activeModel) {
              reply = mockLLMResponse(activeModel, text);
              appendMessage("assistant", reply);
            } else {
              renderMultiLLMResponses(text);
              reply = "Three LLM responses were generated. Choose one to continue.";
              appendMessage("assistant", reply);
            }

            // Save assistant message
            await fetch(`/api/chats/${currentChatId}/messages`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                role: "assistant",
                message: reply
              })
            });

          } catch (err) {
            console.error(err);
            appendMessage("assistant", "Error sending message.");
          }

          sendBtn.disabled = false;
        }

        // ── Fetch Chat History ───────────────────────────────────
        async function loadChats() {
          try {
            const res = await fetch("/api/chats");
            const chats = await res.json();

            const chatList = document.getElementById("chatList");
            chatList.innerHTML = "";

            chats.forEach(chat => {
              const item = document.createElement("div");
              item.className = "chat-item";
              item.textContent = chat.title || "New Chat";

              item.onclick = () => loadMessages(chat.id);

              chatList.appendChild(item);
            });
          } catch (err) {
            console.error("Failed to load chats");
          }
        }

        // ── Load Messages ────────────────────────────────────────
        async function loadMessages(chatId) {
          currentChatId = chatId;

          const res = await fetch(`/api/chats/${chatId}/messages`);
          const messages = await res.json();

          const container = document.getElementById("chatMessages");
          container.innerHTML = "";

          document.getElementById("multiLLMResponses").innerHTML = "";

          messages.forEach(m => {
            appendMessage(m.role, m.message);
          });
        }

        // ── Search Chats ─────────────────────────────────────────
        const searchInput = document.getElementById("chatSearch");

        searchInput.addEventListener("input", async () => {
          const query = searchInput.value.trim();

          if (!query) {
            loadChats();
            return;
          }

          const res = await fetch(`/api/chats/search?q=${encodeURIComponent(query)}`);
          const chats = await res.json();

          const chatList = document.getElementById("chatList");
          chatList.innerHTML = "";

          chats.forEach(chat => {
            const item = document.createElement("div");
            item.className = "chat-item";
            item.textContent = chat.title || "New Chat";

            item.onclick = () => loadMessages(chat.id);

            chatList.appendChild(item);
          });
        });

        loadChats();
      </script>
    </div>
  </div>
</body>
</html>
